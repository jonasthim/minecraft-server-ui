  "components": {
    "parameters": {
      "UpdateInstanceId": {
        "name": "instanceId",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string"
        }
      },
      "UpdatePreviewId": {
        "name": "previewId",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "pattern": "^[a-f0-9]{32}$"
        }
      }
    },
    "schemas": {
      "UpdateRequest": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "mode": {
            "type": "string",
            "enum": [
              "manual",
              "automatic"
            ]
          },
          "selection": {
            "$ref": "#/components/schemas/VersionSelection"
          },
          "content_selections": {
            "type": "object",
            "maxProperties": 2048,
            "additionalProperties": {
              "$ref": "#/components/schemas/ContentSelection"
            }
          },
          "countdown_seconds": {
            "type": "integer",
            "minimum": 0,
            "maximum": 3600,
            "description": "Defaults to 300 seconds; explicit zero is preserved."
          },
          "pack": {
            "$ref": "#/components/schemas/ModpackRequest"
          },
          "content_manual": {
            "type": "object",
            "maxProperties": 2048,
            "additionalProperties": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            },
            "description": "Manual mode only; installed content ID to owned verified upload receipt. Each key requires an exact content_selections entry; administrator and PAT admin required."
          }
        },
        "required": [
          "mode"
        ]
      },
      "UpdateSnapshot": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "instance_revision": {
            "type": "string"
          },
          "generation": {
            "type": "string"
          },
          "content_revision": {
            "type": "string"
          },
          "pack_revision": {
            "type": "string"
          }
        },
        "required": [
          "instance_revision",
          "generation",
          "content_revision",
          "pack_revision"
        ]
      },
      "UpdateBlocker": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "code": {
            "type": "string"
          },
          "message": {
            "type": "string"
          }
        },
        "required": [
          "code",
          "message"
        ]
      },
      "UpdateChange": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "component": {
            "type": "string"
          },
          "before": {
            "type": "string"
          },
          "after": {
            "type": "string"
          }
        },
        "required": [
          "component",
          "before",
          "after"
        ]
      },
      "UpdateArtifact": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "filename": {
            "type": "string"
          },
          "size": {
            "type": "integer",
            "minimum": 1
          },
          "sha256": {
            "type": "string",
            "description": "Locally known SHA256; empty when only published SHA1 is available at planning."
          },
          "checksum": {
            "$ref": "#/components/schemas/Checksum"
          }
        },
        "required": [
          "filename",
          "size",
          "sha256",
          "checksum"
        ]
      },
      "UpdateRuntime": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string"
          },
          "major": {
            "type": "integer"
          },
          "version": {
            "type": "string"
          },
          "os": {
            "type": "string"
          },
          "architecture": {
            "type": "string",
            "enum": [
              "x64"
            ]
          },
          "sha256": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          }
        },
        "required": [
          "id",
          "major",
          "version",
          "os",
          "architecture",
          "sha256"
        ]
      },
      "UpdateRequirements": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "java_major": {
            "type": "integer"
          },
          "min_java_major": {
            "type": "integer"
          },
          "max_java_major": {
            "type": "integer"
          },
          "requires_installer": {
            "type": "boolean"
          }
        },
        "required": [
          "java_major",
          "min_java_major",
          "requires_installer"
        ]
      },
      "UpdatePlan": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string"
          },
          "instance_id": {
            "type": "string"
          },
          "mode": {
            "type": "string",
            "enum": [
              "manual",
              "automatic"
            ]
          },
          "snapshot": {
            "$ref": "#/components/schemas/UpdateSnapshot"
          },
          "from": {
            "$ref": "#/components/schemas/VersionSelection"
          },
          "target": {
            "$ref": "#/components/schemas/VersionSelection"
          },
          "requirements": {
            "$ref": "#/components/schemas/UpdateRequirements"
          },
          "runtime": {
            "$ref": "#/components/schemas/UpdateRuntime"
          },
          "artifacts": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/UpdateArtifact"
            }
          },
          "changes": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/UpdateChange"
            }
          },
          "blockers": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/UpdateBlocker"
            }
          },
          "countdown_seconds": {
            "type": "integer",
            "minimum": 0,
            "maximum": 3600
          },
