  "components": {
    "schemas": {
      "CatalogAvailability": {
        "type": "object",
        "required": [
          "provider",
          "enabled",
          "reason"
        ],
        "properties": {
          "provider": {
            "type": "string",
            "enum": [
              "modrinth",
              "curseforge",
              "hangar"
            ]
          },
          "enabled": {
            "type": "boolean"
          },
          "reason": {
            "type": "string"
          }
        },
        "additionalProperties": false
      },
      "CatalogProviders": {
        "type": "object",
        "required": [
          "providers"
        ],
        "properties": {
          "providers": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/CatalogAvailability"
            }
          }
        },
        "additionalProperties": false
      },
      "CatalogKeyInput": {
        "type": "object",
        "required": [
          "key"
        ],
        "properties": {
          "key": {
            "type": "string",
            "maxLength": 512,
            "writeOnly": true,
            "description": "Private operator-supplied CurseForge key. Empty string clears it. Never returned or logged."
          }
        },
        "additionalProperties": false
      },
      "CatalogCompatibility": {
        "type": "object",
        "required": [
          "minecraft",
          "loaders",
          "environment",
          "server_side",
          "evidence",
          "tested"
        ],
        "properties": {
          "minecraft": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "loaders": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "environment": {
            "type": "string"
          },
          "server_side": {
            "type": "string",
            "enum": [
              "supported",
              "unsupported",
              "unknown"
            ]
          },
          "evidence": {
            "type": "string"
          },
          "tested": {
            "type": "boolean",
            "const": false
          }
        },
        "additionalProperties": false
      },
      "CatalogProjectMetadata": {
        "type": "object",
        "required": [
          "source",
          "fetched_at",
          "id",
          "slug",
          "kind",
          "title",
          "description",
          "official_url",
          "compatibility"
        ],
        "properties": {
          "source": {
            "type": "string",
            "enum": [
              "modrinth",
              "curseforge",
              "hangar"
            ]
          },
          "fetched_at": {
            "type": "string",
            "format": "date-time"
          },
          "id": {
            "type": "string"
          },
          "slug": {
            "type": "string"
          },
          "kind": {
            "type": "string",
            "enum": [
              "mod",
              "plugin",
              "modpack"
            ]
          },
          "title": {
            "type": "string"
          },
          "description": {
            "type": "string"
          },
          "official_url": {
            "type": "string",
            "format": "uri"
          },
          "compatibility": {
            "$ref": "#/components/schemas/CatalogCompatibility"
          }
        },
        "additionalProperties": false
      },
      "CatalogDependency": {
        "type": "object",
        "required": [
          "provider",
          "project_id",
          "version_id",
          "name",
          "relation",
          "required",
          "manual_url",
          "platform"
        ],
        "properties": {
          "provider": {
            "type": "string",
            "enum": [
              "modrinth",
              "curseforge",
              "hangar"
            ]
          },
          "project_id": {
            "type": "string"
          },
          "version_id": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "relation": {
            "type": "string"
          },
          "required": {
            "type": "boolean"
          },
          "manual_url": {
            "type": "string"
          },
          "platform": {
            "type": "string"
          }
        },
        "additionalProperties": false
      },
      "CatalogFile": {
        "type": "object",
        "required": [
          "id",
          "filename",
          "download_url",
          "size",
          "hashes",
          "primary",
          "role",
          "manual_reason",
          "official_url"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "filename": {
            "type": "string"
          },
          "download_url": {
            "type": "string",
            "description": "Approved direct publisher CDN URL, empty when manual resolution is required. Browser must use official_url for user-facing links."
          },
          "size": {
            "type": "integer",
            "format": "int64"
          },
          "hashes": {
            "type": "object",
            "additionalProperties": {
              "type": "string"
            }
          },
          "primary": {
            "type": "boolean"
          },
          "role": {
            "type": "string"
          },
          "manual_reason": {
            "type": "string"
          },
          "official_url": {
            "type": "string",
            "format": "uri"
          }
        },
        "additionalProperties": false
      },
      "CatalogVersionMetadata": {
        "type": "object",
        "required": [
          "source",
          "fetched_at",
          "id",
          "upstream_id",
          "project_id",
          "name",
          "number",
          "published_at",
          "official_url",
          "compatibility",
          "dependencies",
          "files",
          "server_pack_file_id",
          "is_server_pack"
        ],
        "properties": {
          "source": {
            "type": "string",
            "enum": [
              "modrinth",
              "curseforge",
              "hangar"
            ]
          },
          "fetched_at": {
            "type": "string",
            "format": "date-time"
          },
          "id": {
            "type": "string",
            "description": "Canonical resolution identifier; Hangar version name."
          },
          "upstream_id": {
            "type": "string",
            "description": "Publisher version ID; numeric Hangar ID retained separately."
          },
          "project_id": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "number": {
            "type": "string"
          },
          "published_at": {
            "type": "string"
          },
          "official_url": {
            "type": "string",
            "format": "uri"
          },
          "compatibility": {
            "$ref": "#/components/schemas/CatalogCompatibility"
          },
          "dependencies": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/CatalogDependency"
            }
          },
          "files": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/CatalogFile"
            }
          },
          "server_pack_file_id": {
            "type": "string"
          },
          "is_server_pack": {
            "type": "boolean"
          }
        },
        "additionalProperties": false
      },
      "CatalogSearchResult": {
        "type": "object",
        "required": [
          "source",
          "fetched_at",
          "projects",
          "offset",
          "limit",
          "total"
        ],
