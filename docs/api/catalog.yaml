                }
              }
            }
          },
          "503": {
            "description": "Provider unavailable; CurseForge requires a private key",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "in": "path",
            "name": "provider",
            "required": true,
            "schema": {
              "type": "string",
              "enum": [
                "modrinth",
                "curseforge",
                "hangar"
              ]
            }
          },
          {
            "in": "query",
            "name": "q",
            "required": false,
            "schema": {
              "type": "string",
              "maxLength": 200
            }
          },
          {
            "in": "query",
            "name": "kind",
            "required": false,
            "schema": {
              "type": "string",
              "enum": [
                "mod",
                "plugin",
                "modpack"
              ]
            }
          },
          {
            "in": "query",
            "name": "minecraft",
            "required": false,
            "schema": {
              "type": "string",
              "maxLength": 160
            }
          },
          {
            "in": "query",
            "name": "loader",
            "required": false,
            "schema": {
              "type": "string",
              "enum": [
                "fabric",
                "forge",
                "neoforge",
                "paper",
                "bukkit",
                "spigot",
                "purpur",
                "quilt"
              ]
            }
          },
          {
            "in": "query",
            "name": "offset",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 0,
              "maximum": 10000,
              "default": 0
            }
          },
          {
            "in": "query",
            "name": "limit",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 50,
              "default": 20,
              "description": "Hangar caps pages at25."
            }
          }
        ]
      }
    },
