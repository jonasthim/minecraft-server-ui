{
  "openapi": "3.1.0",
  "info": {
    "title": "Console feature contract fragment",
    "version": "0.0.0"
  },
  "paths": {
    "/api/v1/instances/{instanceId}/console/logs": {
      "get": {
        "operationId": "consoleLogs",
        "tags": [
          "console"
        ],
        "summary": "Viewer: bounded redacted durable console history. Cursor replay discloses retention gaps.",
        "security": [
          {
            "sessionCookie": []
          },
          {
            "personalToken": []
          }
        ],
        "parameters": [
          {
            "name": "instanceId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "after",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 0,
              "default": 0
            }
          },
          {
            "name": "limit",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 500,
              "default": 100
            }
          }
        ],
        "responses": {
          "401": {
            "description": "Authentication required"
          },
          "403": {
            "description": "Role, token scope or CSRF denied"
          },
          "404": {
            "description": "Instance not found"
          },
          "409": {
            "description": "Instance admission busy"
          },
          "422": {
            "description": "Unsupported command or invalid cursor/input"
          },
          "503": {
            "description": "Native control or stream capacity unavailable"
          },
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ConsolePage"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/instances/{instanceId}/console/status": {
      "get": {
        "operationId": "consoleStatus",
        "tags": [
          "console"
        ],
        "summary": "Viewer: native readiness, process state and required native settings are separate.",
        "security": [
          {
            "sessionCookie": []
          },
          {
            "personalToken": []
          }
        ],
        "parameters": [
          {
            "name": "instanceId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "401": {
            "description": "Authentication required"
          },
          "403": {
            "description": "Role, token scope or CSRF denied"
          },
          "404": {
            "description": "Instance not found"
          },
          "409": {
            "description": "Instance admission busy"
          },
          "422": {
            "description": "Unsupported command or invalid cursor/input"
          },
          "503": {
            "description": "Native control or stream capacity unavailable"
          },
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ConsoleStateResponse"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/instances/{instanceId}/console/events": {
      "get": {
        "operationId": "consoleEvents",
        "tags": [
          "console"
        ],
        "summary": "Viewer: bounded SSE console snapshots; absolute 30 second authorization lifetime, 64 total subscribers, Last-Event-ID replay.",
        "security": [
          {
            "sessionCookie": []
          },
          {
            "personalToken": []
          }
        ],
        "parameters": [
          {
            "name": "instanceId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "after",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 0,
              "default": 0
            }
          },
          {
            "name": "limit",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 500,
              "default": 100
            }
          },
          {
            "name": "Last-Event-ID",
            "in": "header",
            "schema": {
              "type": "string",
              "pattern": "^[0-9]+$"
            }
          }
        ],
        "responses": {
          "401": {
            "description": "Authentication required"
          },
          "403": {
            "description": "Role, token scope or CSRF denied"
          },
          "404": {
            "description": "Instance not found"
          },
          "409": {
            "description": "Instance admission busy"
          },
          "422": {
            "description": "Unsupported command or invalid cursor/input"
          },
          "503": {
            "description": "Native control or stream capacity unavailable"
          },
          "200": {
            "description": "SSE console event stream",
            "content": {
              "text/event-stream": {
                "schema": {
                  "type": "string",
                  "description": "id: cursor; event: console; data: ConsoleEvent JSON. Reconnect reauthenticates and replays retained lines."
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/instances/{instanceId}/console/commands": {
      "post": {
        "operationId": "consoleCommands",
        "tags": [
          "console"
        ],
        "summary": "Operator: queue exact list or say command. Admin and admin token scope required for seed. Transport delivery alone does not acknowledge execution.",
        "security": [
          {
            "sessionCookie": []
          },
          {
            "personalToken": []
          }
        ],
        "parameters": [
          {
            "name": "instanceId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "401": {
            "description": "Authentication required"
          },
          "403": {
            "description": "Role, token scope or CSRF denied"
          },
          "404": {
            "description": "Instance not found"
          },
          "409": {
            "description": "Instance admission busy"
          },
          "422": {
            "description": "Unsupported command or invalid cursor/input"
          },
          "503": {
            "description": "Native control or stream capacity unavailable"
          },
          "202": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "job": {
                      "$ref": "#/components/schemas/Job"
                    }
                  },
                  "required": [
                    "job"
                  ],
                  "additionalProperties": false
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ConsoleCommandRequest"
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "ConsoleLine": {
        "type": "object",
        "properties": {
          "id": {
            "type": "integer",
            "format": "int64"
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          },
          "message": {
            "type": "string"
          },
          "gap": {
            "type": "boolean"
          }
        },
        "required": [
          "id",
          "created_at",
          "message",
          "gap"
        ],
        "additionalProperties": false
      },
      "ConsolePage": {
        "type": "object",
        "properties": {
          "lines": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/ConsoleLine"
            }
          },
          "next_cursor": {
            "type": "integer",
            "format": "int64"
          },
          "gap": {
            "type": "boolean"
          }
        },
        "required": [
          "lines",
          "next_cursor",
          "gap"
        ],
        "additionalProperties": false
      },
      "ConsoleState": {
        "type": "object",
        "properties": {
          "process_running": {
            "type": "boolean"
          },
          "control_connected": {
            "type": "boolean"
          },
          "game_ready": {
            "type": "boolean"
          },
          "required_settings_verified": {
            "type": "boolean"
          },
          "ready_for_use": {
            "type": "boolean"
          },
          "status": {
            "type": "string"
          },
          "reason": {
            "type": "string"
          },
          "source": {
            "type": "string"
          },
          "rule_scope": {
            "type": "string"
          },
          "gameplay_effect": {
            "type": "string"
          },
          "observed_at": {
            "type": "string",
            "format": "date-time"
          },
          "logs_available": {
            "type": "boolean"
          },
          "logs_reason": {
            "type": "string"
          },
          "logs_observed_at": {
            "type": "string",
            "format": "date-time"
          }
        },
        "required": [
          "process_running",
          "control_connected",
          "game_ready",
          "required_settings_verified",
          "ready_for_use",
          "status",
          "reason",
          "source",
          "rule_scope",
          "gameplay_effect",
          "observed_at",
          "logs_available",
          "logs_reason",
          "logs_observed_at"
        ],
        "additionalProperties": false
      },
      "ConsoleEvent": {
        "type": "object",
        "properties": {
          "page": {
            "$ref": "#/components/schemas/ConsolePage"
          },
          "state": {
            "$ref": "#/components/schemas/ConsoleState"
          }
        },
        "required": [
          "page",
          "state"
        ],
        "additionalProperties": false
      },
      "ConsoleStateResponse": {
        "type": "object",
        "properties": {
          "state": {
            "$ref": "#/components/schemas/ConsoleState"
          }
        },
        "required": [
          "state"
        ],
        "additionalProperties": false
      },
      "ConsoleCommandRequest": {
        "type": "object",
        "properties": {
          "command": {
            "type": "string",
            "minLength": 1,
            "maxLength": 516,
            "description": "Exact lowercase list, say plain text (1\u2013512 UTF-8 bytes, no selectors), or admin seed. No aliases, wrappers, lifecycle/save/config or player-privilege commands."
          }
        },
        "required": [
          "command"
        ],
        "additionalProperties": false
      }
    }
  }
}
