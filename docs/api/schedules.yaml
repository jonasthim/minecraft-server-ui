  "components": {
    "schemas": {
      "ScheduleInput": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 80
          },
          "enabled": {
            "type": "boolean"
          },
          "action": {
            "type": "string",
            "enum": [
              "backup",
              "command",
              "announcement",
              "restart",
              "update"
            ]
          },
          "expression": {
            "type": "string",
            "minLength": 1,
            "maxLength": 256
          },
          "timezone": {
            "type": "string",
            "maxLength": 128
          },
          "command": {
            "type": "string",
            "maxLength": 516
          },
          "announcement": {
            "type": "string",
            "maxLength": 512
          },
          "backup_kind": {
            "type": "string",
            "enum": [
              "world",
              "full"
            ]
          },
          "countdown_seconds": {
            "type": "integer",
            "minimum": 0,
            "maximum": 3600,
            "default": 300
          }
        },
        "required": [
          "name",
          "action",
          "expression"
        ]
      },
      "ScheduleRun": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string"
          },
          "schedule_id": {
            "type": "string"
          },
          "instance_id": {
            "type": "string"
          },
          "due_at": {
            "type": "string",
            "format": "date-time"
          },
          "state": {
            "type": "string",
            "enum": [
              "claimed",
              "admitted",
              "blocked",
              "skipped_downtime",
              "skipped_overlap"
            ]
          },
          "job_id": {
            "type": "string"
          },
          "job_state": {
            "type": "string",
            "enum": [
              "queued",
              "running",
              "succeeded",
              "failed",
              "cancelled"
            ]
          },
          "reason": {
            "type": "string"
          }
        },
        "required": [
          "id",
          "schedule_id",
          "instance_id",
          "due_at",
          "state"
        ]
      },
      "ScheduleRecord": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string"
          },
          "instance_id": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "enabled": {
            "type": "boolean"
          },
          "action": {
            "type": "string",
            "enum": [
              "backup",
              "command",
              "announcement",
              "restart",
              "update"
            ]
          },
          "expression": {
            "type": "string"
          },
          "timezone": {
            "type": "string"
          },
          "command": {
            "type": "string"
          },
          "announcement": {
            "type": "string"
          },
          "backup_kind": {
            "type": "string",
            "enum": [
              "world",
              "full"
            ]
          },
          "countdown_seconds": {
            "type": "integer"
          },
          "next_run_at": {
            "type": "string",
            "format": "date-time"
          },
          "actor_id": {
            "type": "integer"
          },
          "disabled_reason": {
            "type": "string"
          },
          "last_run": {
            "$ref": "#/components/schemas/ScheduleRun"
          }
        },
        "required": [
          "id",
          "instance_id",
          "name",
          "enabled",
          "action",
          "expression",
          "timezone",
          "countdown_seconds",
          "actor_id",
          "disabled_reason"
        ]
      },
      "ScheduleListResponse": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "schedules": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/ScheduleRecord"
            }
          },
          "default_timezone": {
            "type": "string"
          },
          "time_policy": {
            "type": "string"
          },
          "available_actions": {
            "type": "array",
            "items": {
              "type": "string",
              "enum": [
                "backup",
                "command",
                "announcement",
                "restart",
                "update"
              ]
            }
          }
        },
        "required": [
          "schedules",
          "default_timezone",
          "time_policy",
          "available_actions"
        ]
      },
      "ScheduleHistoryResponse": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "runs": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/ScheduleRun"
            }
          }
        },
        "required": [
          "runs"
        ]
      },
      "RecoveryAttempt": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string"
          },
          "due_at": {
            "type": "string",
            "format": "date-time"
          },
          "admitted_at": {
            "type": "string",
            "format": "date-time"
          },
          "state": {
            "type": "string",
            "enum": [
              "pending",
              "queued",
              "admitted",
              "cancelled",
              "blocked"
            ]
          },
          "job_id": {
            "type": "string"
          },
          "reason": {
            "type": "string"
          }
        },
        "required": [
          "id",
          "due_at",
          "state"
        ]
      },
      "RecoveryStatus": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "enabled": {
            "type": "boolean"
          },
          "actor_id": {
            "type": "integer"
          },
          "reason": {
            "type": "string"
          },
          "attempts": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/RecoveryAttempt"
            }
          }
        },
        "required": [
          "enabled",
          "actor_id",
          "reason",
          "attempts"
        ]
      },
      "RecoveryInput": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "enabled": {
            "type": "boolean"
          }
        },
        "required": [
          "enabled"
        ]
      }
    }
  }
}
