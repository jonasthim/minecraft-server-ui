            "description": "Authentication, authorization, validation or availability failure",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "NotificationProvider": {
        "type": "string",
        "enum": [
          "discord",
          "slack",
          "ntfy",
          "telegram",
          "webhook",
          "email"
        ]
      },
      "NotificationEventKind": {
        "type": "string",
        "enum": [
          "job_failed",
          "job_succeeded"
        ]
      },
      "NotificationDestination": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "endpoint": {
            "type": "string",
            "writeOnly": true
          },
          "secret": {
            "type": "string",
            "writeOnly": true
          },
          "recipient": {
            "type": "string",
            "writeOnly": true
          },
          "smtp_host": {
            "type": "string"
          },
          "smtp_port": {
            "type": "integer"
          },
          "smtp_user": {
            "type": "string",
            "writeOnly": true
          },
          "smtp_password": {
            "type": "string",
            "writeOnly": true
          },
          "from": {
            "type": "string",
            "writeOnly": true
          },
          "tls_mode": {
            "type": "string",
            "enum": [
              "",
              "tls",
              "starttls"
            ]
          }
        }
      },
      "NotificationChannel": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string"
          },
          "label": {
            "type": "string"
          },
          "provider": {
            "type": "string",
            "enum": [
              "discord",
              "slack",
              "ntfy",
              "telegram",
              "webhook",
              "email"
            ]
          },
          "enabled": {
            "type": "boolean"
          },
          "events": {
            "type": "array",
            "items": {
              "type": "string",
              "enum": [
                "job_failed",
                "job_succeeded"
              ]
            }
          },
          "allow_private": {
            "type": "boolean"
          },
          "configured": {
            "type": "boolean"
          },
          "secret_set": {
            "type": "boolean"
          },
          "recipient_set": {
            "type": "boolean"
          }
        },
        "required": [
          "id",
          "label",
          "provider",
          "enabled",
          "events",
          "allow_private",
          "configured",
          "secret_set",
          "recipient_set"
        ]
      },
      "NotificationChannelInput": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "label": {
            "type": "string"
          },
          "provider": {
            "type": "string",
            "enum": [
              "discord",
              "slack",
              "ntfy",
              "telegram",
              "webhook",
              "email"
            ]
          },
          "enabled": {
            "type": "boolean"
          },
          "events": {
            "type": "array",
            "items": {
              "type": "string",
              "enum": [
                "job_failed",
                "job_succeeded"
              ]
            }
          },
          "allow_private": {
            "type": "boolean"
          },
          "replace": {
            "$ref": "#/components/schemas/NotificationDestination"
          },
          "clear": {
            "type": "boolean"
          }
        },
        "required": [
          "label",
          "provider",
          "enabled",
          "events",
          "allow_private",
          "clear"
        ]
      },
      "NotificationChannels": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "channels": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/NotificationChannel"
            }
          }
        },
        "required": [
          "channels"
        ]
      },
      "NotificationDelivery": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "integer"
          },
          "channel_id": {
            "type": "string"
          },
          "provider": {
            "type": "string",
            "enum": [
              "discord",
              "slack",
              "ntfy",
              "telegram",
              "webhook",
              "email"
            ]
          },
          "instance_id": {
            "type": "string"
          },
          "event_kind": {
            "type": "string",
            "enum": [
              "job_failed",
              "job_succeeded"
            ]
          },
          "status": {
            "type": "string",
            "enum": [
              "queued",
              "sending",
              "sent",
              "failed",
              "unknown_after_crash"
            ]
          },
          "attempts": {
            "type": "integer"
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          },
          "updated_at": {
            "type": "string",
            "format": "date-time"
          },
          "safe_failure": {
            "type": "string"
          }
        },
        "required": [
          "id",
          "channel_id",
          "provider",
          "instance_id",
          "event_kind",
          "status",
          "attempts",
          "created_at",
          "updated_at",
          "safe_failure"
        ]
      },
      "NotificationHistory": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "deliveries": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/NotificationDelivery"
            }
          },
          "next_cursor": {
            "type": "integer"
          }
        },
        "required": [
          "deliveries",
          "next_cursor"
        ]
      }
    }
  }
}