      }
    },
    "/api/v1/notifications/history": {
      "get": {
        "operationId": "notificationsHistory",
        "summary": "Administrator: safe delivery history retained 30 days/10000 rows. Sending at crash is unknown, never replayed automatically.",
        "security": [
          {
            "sessionCookie": []
          },
          {
            "personalToken": []
          }
        ],
        "parameters": [
          {
            "in": "query",
            "name": "before",
            "required": false,
            "schema": {
              "type": "integer"
            }
          },
          {
            "in": "query",
            "name": "limit",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 50
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/NotificationHistory"
                }
              }
            }
          },
          "401": {
