  "components": {
    "schemas": {
      "SelfUpdateStatus": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "current_version",
          "schema",
          "trust_configured",
          "activation_available",
          "disabled_reason",
          "schema_policy"
        ],
        "properties": {
          "current_version": {
            "type": "string",
            "maxLength": 64
          },
          "schema": {
            "type": "integer",
            "format": "int64"
          },
          "trust_configured": {
            "type": "boolean"
          },
          "activation_available": {
            "type": "boolean"
          },
          "disabled_reason": {
            "type": "string",
            "maxLength": 512
          },
          "schema_policy": {
            "type": "string",
            "enum": [
              "unchanged_schema_only"
            ]
          }
        }
      },
      "SelfUpdateCheck": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "version",
          "platform",
          "published_at",
          "expires_at",
          "binary_sha256",
          "schema"
        ],
        "properties": {
          "version": {
            "type": "string",
            "maxLength": 64
          },
          "platform": {
            "type": "string",
            "maxLength": 64
          },
          "published_at": {
            "type": "string",
            "format": "date-time",
            "maxLength": 64
          },
          "expires_at": {
            "type": "string",
            "format": "date-time",
            "maxLength": 64
          },
          "binary_sha256": {
            "type": "string",
            "maxLength": 64,
            "minLength": 64
          },
          "schema": {
            "type": "integer",
            "format": "int64"
          }
        }
      },
      "SelfUpdateStage": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "version",
          "platform",
          "binary_sha256",
          "schema"
        ],
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$",
            "maxLength": 64,
            "minLength": 64
          },
          "version": {
            "type": "string",
            "maxLength": 64
          },
          "platform": {
            "type": "string",
            "maxLength": 64
          },
          "binary_sha256": {
            "type": "string",
            "maxLength": 64,
            "minLength": 64
          },
          "schema": {
            "type": "integer",
            "format": "int64"
          }
        }
      },
      "SelfUpdateVersionInput": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "version"
        ],
        "properties": {
          "version": {
            "type": "string",
            "pattern": "^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$",
            "maxLength": 64
          }
        }
      },
      "SelfUpdateApplyInput": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "stage_id",
          "confirm"
        ],
        "properties": {
          "stage_id": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$",
            "maxLength": 64,
            "minLength": 64
          },
          "confirm": {
            "type": "boolean"
          }
        }
      },
      "SelfUpdateAccepted": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "status"
        ],
        "properties": {
          "status": {
            "type": "string",
            "enum": [
              "accepted"
            ]
          }
        }
      }
    }
  }
