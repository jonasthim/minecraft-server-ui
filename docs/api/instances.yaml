    "/api/v1/instance-settings/capabilities": {
      "get": {
        "operationId": "instanceSettingsCapabilities",
        "tags": [
          "instances"
        ],
        "summary": "Viewer: reviewed version-family setting mappings; desired values are not applied/effective claims.",
        "security": [
          {
            "sessionCookie": []
          },
          {
            "personalToken": []
          }
        ],
        "parameters": [
          {
            "name": "flavor",
            "in": "query",
            "required": true,
            "schema": {
              "$ref": "#/components/schemas/Flavor"
            }
          },
          {
            "name": "minecraft_version",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Reviewed mapping for requested version family",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "settings": {
                      "$ref": "#/components/schemas/InstanceSettingsProjection"
                    }
                  },
                  "required": [
                    "settings"
                  ],
                  "additionalProperties": false
                }
              }
            }
          },
          "401": {
            "description": "Authentication required",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "403": {
            "description": "Role/token scope denied",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "422": {
            "description": "Unsupported version/flavor family",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "InstanceSpec": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^[a-z0-9][a-z0-9-]{0,31}$"
          },
          "name": {
            "type": "string"
          },
          "flavor": {
            "$ref": "#/components/schemas/Flavor"
          },
          "minecraft_version": {
            "type": "string"
          },
          "loader_version": {
            "type": "string",
            "description": "Exact loader version; for Paper this carries the positive numeric pinned Paper build. Empty is allowed for an uninstalled draft; Vanilla requires empty."
          },
          "java_major": {
            "type": "integer",
            "description": "Optional legacy input; server derives this requirement using reviewed runtime selection rules. Exact published provider build compatibility is checked before installation."
          },
          "memory_mib": {
            "type": "integer"
          },
          "game_port": {
            "type": "integer"
          }
        },
        "required": [
          "id",
          "name",
          "flavor",
          "minecraft_version",
          "memory_mib",
          "game_port"
        ],
        "additionalProperties": false
      },
      "InstanceConfig": {
        "type": "object",
        "properties": {
          "motd": {
            "type": "string",
            "maxLength": 2048
          },
          "difficulty": {
            "type": "string",
            "enum": [
              "peaceful",
              "easy",
              "normal",
              "hard"
            ]
          },
          "game_mode": {
            "type": "string",
            "enum": [
              "survival",
              "creative",
              "adventure",
              "spectator"
            ]
          },
          "max_players": {
            "type": "integer",
            "minimum": 1,
            "maximum": 10000
          },
          "online_mode": {
            "type": "boolean"
          },
          "pvp": {
            "type": "boolean"
          },
          "view_distance": {
            "type": "integer",
            "minimum": 2,
            "maximum": 32
          },
          "simulation_distance": {
            "type": "integer",
            "minimum": 2,
            "maximum": 32
          },
          "level_name": {
            "type": "string",
            "maxLength": 64
          },
          "level_seed": {
            "type": "string",
            "maxLength": 256
          },
          "extra": {
            "type": "object",
            "additionalProperties": {
              "type": "string"
            }
          }
        },
        "additionalProperties": false,
        "required": [
          "motd",
          "difficulty",
          "game_mode",
          "max_players",
          "online_mode",
          "pvp",
          "view_distance",
          "simulation_distance",
          "level_name",
          "level_seed",
          "extra"
        ]
      },
      "InstanceEULA": {
        "type": "object",
        "properties": {
          "accepted": {
            "type": "boolean"
          },
          "accepted_by": {
            "type": "integer"
          },
          "accepted_at": {
            "type": "string",
            "format": "date-time"
          }
        },
        "required": [
          "accepted"
        ],
        "additionalProperties": false
      },
      "InstanceDraft": {
        "type": "object",
        "properties": {
          "instance": {
            "$ref": "#/components/schemas/InstanceSpec"
          },
          "config": {
            "$ref": "#/components/schemas/InstanceConfig"
          },
          "accept_eula": {
            "type": "boolean",
            "default": false
          }
        },
        "required": [
          "instance",
          "config"
        ],
        "additionalProperties": false
      },
      "InstanceDetail": {
        "type": "object",
        "properties": {
          "instance": {
            "$ref": "#/components/schemas/Instance"
          },
          "config": {
            "$ref": "#/components/schemas/InstanceConfig"
          },
          "eula": {
            "$ref": "#/components/schemas/InstanceEULA"
          },
          "provisioning": {
            "type": "string",
            "description": "Truthful persisted provisioning state; creating metadata does not install a server."
          },
          "settings": {
            "$ref": "#/components/schemas/InstanceSettingsProjection"
          }
        },
        "required": [
          "instance",
          "config",
          "eula",
          "provisioning",
          "settings"
        ],
        "additionalProperties": false
      },
      "InstanceDelete": {
        "type": "object",
        "properties": {
          "confirmation": {
            "type": "string",
            "description": "Exact instance id; confirms permanent removal of server, world, logs and local backups."
          }
        },
        "required": [
          "confirmation"
        ],
        "additionalProperties": false
      },
      "InstanceSettingCapability": {
        "type": "object",
        "properties": {
          "available": {
            "type": "boolean",
            "description": "Whether the reviewed native setting mapping exists; does not assert runtime application."
          },
          "method": {
            "type": "string",
            "enum": [
              "server_property",
              "runtime_gamerule",
              "unsupported"
            ]
          },
          "reason": {
            "type": "string"
          }
        },
        "required": [
          "available",
          "method",
          "reason"
        ],
        "additionalProperties": false
      },
      "InstanceDesiredRuntimeSetting": {
        "type": "object",
        "properties": {
          "kind": {
            "type": "string",
            "enum": [
              "boolean_gamerule"
            ]
          },
          "rule": {
            "type": "string",
            "description": "Exact version-specific native gamerule identifier; discover before use."
          },
          "value": {
            "type": "boolean"
          },
          "status": {
            "type": "string",
            "enum": [
              "unverified"
            ]
          },
          "supported": {
            "type": "boolean"
          },
          "reason": {
            "type": "string"
          },
          "source": {
            "type": "string",
            "format": "uri"
          },
          "applicability": {
            "type": "object",
            "properties": {
              "flavor": {
                "$ref": "#/components/schemas/Flavor"
              },
              "minecraft_version": {
                "type": "string"
              },
              "loader_version": {
                "type": "string"
              }
            },
            "required": [
              "flavor",
              "minecraft_version"
            ],
            "additionalProperties": false
          },
          "scope": {
            "type": "string",
            "enum": [
              "native_server_rules"
            ]
          },
          "verification": {
            "type": "string",
            "enum": [
              "native_rule_readback"
            ]
          },
          "gameplay_effect": {
            "type": "string",
            "enum": [
              "not_verified"
            ]
          }
        },
        "required": [
          "kind",
          "rule",
          "value",
          "status",
          "supported",
          "reason",
          "source",
          "applicability",
          "scope",
          "verification",
          "gameplay_effect"
        ],
        "additionalProperties": false
      },
      "InstanceSettingsProjection": {
        "type": "object",
        "properties": {
          "legacy_numeric_enums": {
            "type": "boolean"
          },
          "simulation_distance": {
            "$ref": "#/components/schemas/InstanceSettingCapability"
          },
          "pvp": {
            "$ref": "#/components/schemas/InstanceSettingCapability"
          },
          "desired_runtime": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/InstanceDesiredRuntimeSetting"
            }
          },
          "seed_reason": {
            "type": "string"
          }
        },
        "required": [
          "legacy_numeric_enums",
          "simulation_distance",
          "pvp",
          "desired_runtime",
          "seed_reason"
        ],
        "additionalProperties": false
      }
    }
  }
}
