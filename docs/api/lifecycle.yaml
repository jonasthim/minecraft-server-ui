  "components": {
    "schemas": {
      "LifecycleSelection": {
        "type": "object",
        "properties": {
          "flavor": {
            "type": "string",
            "enum": [
              "vanilla",
              "paper",
              "fabric",
              "forge",
              "neoforge"
            ]
          },
          "minecraft_version": {
            "type": "string"
          },
          "loader_version": {
            "type": "string"
          }
        },
        "required": [
          "flavor",
          "minecraft_version"
        ],
        "additionalProperties": false
      },
      "LifecycleCatalog": {
        "type": "object",
        "properties": {
          "versions": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "loaders": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "qualification": {
            "type": "string"
          }
        },
        "required": [
          "versions",
          "loaders",
          "qualification"
        ],
        "additionalProperties": false
      },
      "LifecycleState": {
        "type": "object",
        "properties": {
          "installed": {
            "type": "boolean"
          },
          "selection": {
            "$ref": "#/components/schemas/LifecycleSelection"
          },
          "process": {
            "type": "string"
          },
          "process_running": {
            "type": "boolean"
          },
          "readiness": {
            "type": "string"
          },
          "autostart_desired": {
            "type": "boolean"
          },
          "autostart_applied": {
            "type": [
              "boolean",
              "null"
            ]
          },
          "autostart_error": {
            "type": "string"
          }
        },
        "required": [
          "installed",
          "process",
          "process_running",
          "readiness",
          "autostart_desired",
          "autostart_applied"
        ],
        "additionalProperties": false
      },
      "LifecyclePreview": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "selection": {
            "$ref": "#/components/schemas/LifecycleSelection"
          },
          "requirements": {
            "type": "object",
            "properties": {
              "java_major": {
                "type": "integer"
              },
              "min_java_major": {
                "type": "integer"
              },
              "max_java_major": {
                "type": "integer"
              },
              "requires_installer": {
                "type": "boolean"
              }
            },
            "required": [
              "java_major",
              "min_java_major",
              "requires_installer"
            ],
            "additionalProperties": false
          },
          "artifacts": {
            "type": "array",
            "items": {
              "type": "object",
              "properties": {
                "filename": {
                  "type": "string"
                },
                "size": {
                  "type": "integer"
                },
                "checksum": {
                  "type": "object",
                  "properties": {
                    "algorithm": {
                      "type": "string"
                    },
                    "value": {
                      "type": "string"
                    }
                  },
                  "required": [
                    "algorithm",
                    "value"
                  ],
                  "additionalProperties": false
                }
              },
              "required": [
                "filename",
                "size",
                "checksum"
              ],
              "additionalProperties": false
            }
          },
          "warnings": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "expires_at": {
            "type": "string",
            "format": "date-time"
          }
        },
        "required": [
          "id",
          "selection",
          "requirements",
          "artifacts",
          "warnings",
          "expires_at"
        ],
        "additionalProperties": false
      },
      "LifecycleRequest": {
        "type": "object",
        "properties": {
          "operation": {
            "type": "string",
            "enum": [
              "install",
              "start",
              "stop",
              "restart",
              "autostart",
              "uninstall"
            ]
          },
          "preview_id": {
            "type": "string"
          },
          "countdown_seconds": {
            "type": "integer",
            "minimum": 0,
            "maximum": 3600,
            "default": 300
          },
          "emergency": {
            "type": "boolean",
            "default": false
          },
          "confirmation": {
            "type": "string"
          },
          "enabled": {
            "type": "boolean"
          }
        },
        "required": [
          "operation"
        ],
        "additionalProperties": false
      },
      "LifecycleJobResponse": {
        "type": "object",
        "properties": {
          "job": {
            "$ref": "#/components/schemas/Job"
          }
        },
        "required": [
          "job"
        ],
        "additionalProperties": false
      }
    }
  }
}