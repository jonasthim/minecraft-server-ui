  "components": {
    "parameters": {
      "ModpackInstanceId": {
        "name": "instanceId",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "pattern": "^[a-z0-9][a-z0-9-]{0,31}$",
          "maxLength": 32
        }
      }
    },
    "schemas": {
      "ModpackSelection": {
        "type": "object",
        "required": [
          "optional",
          "selected",
          "pinned",
          "excluded",
          "disabled"
        ],
        "properties": {
          "optional": {
            "type": "boolean"
          },
          "selected": {
            "type": "boolean"
          },
          "pinned": {
            "type": "boolean"
          },
          "excluded": {
            "type": "boolean"
          },
          "disabled": {
            "type": "boolean"
          }
        },
        "additionalProperties": false
      },
      "ModpackRequest": {
        "type": "object",
        "required": [
          "pack",
          "choices",
          "selections",
          "manual"
        ],
        "properties": {
          "pack": {
            "$ref": "#/components/schemas/ContentSelection"
          },
          "choices": {
            "type": "object",
            "additionalProperties": {
              "type": "string",
              "enum": [
                "keep",
                "upstream"
              ],
              "maxLength": 2048
            },
            "maxProperties": 8192
          },
          "selections": {
            "type": "object",
            "additionalProperties": {
              "$ref": "#/components/schemas/ModpackSelection"
            },
            "maxProperties": 8192
          },
          "manual": {
            "type": "object",
            "additionalProperties": {
              "type": "string",
              "maxLength": 2048
            },
            "description": "Task16 administrator upload IDs keyed by exact pack path",
            "maxProperties": 8192
          },
          "previous_preview_id": {
            "type": "string",
            "pattern": "^[0-9a-f]{32}$",
            "description": "Actor-owned earlier preview of the same exact verified pack; reuses only matching verified private member receipts."
          },
          "archive_receipt_id": {
            "type": "string",
            "pattern": "^[0-9a-f]{32}$",
            "description": "Actor-bound, expiring receipt for the exact official original/resolved server archive"
          }
        },
        "additionalProperties": false
      },
      "ModpackSource": {
        "type": "object",
        "required": [
          "selection",
          "official_url",
          "name",
          "sha256",
          "provenance",
          "artifact_selection"
        ],
        "properties": {
          "selection": {
            "$ref": "#/components/schemas/ContentSelection"
          },
          "official_url": {
            "type": "string",
            "maxLength": 2048
          },
          "name": {
            "type": "string",
            "maxLength": 2048
          },
          "sha256": {
            "type": "string",
            "maxLength": 2048
          },
          "provenance": {
            "type": "object",
            "required": [
              "source",
              "fetched_at"
            ],
            "properties": {
              "source": {
                "type": "string",
                "maxLength": 2048
              },
              "fetched_at": {
                "type": "string",
                "maxLength": 2048
              }
            },
            "additionalProperties": false
          },
          "artifact_selection": {
            "$ref": "#/components/schemas/ContentSelection"
          }
        },
        "additionalProperties": false
      },
      "ModpackChange": {
        "type": "object",
        "required": [
          "path",
          "baseline",
          "before",
          "upstream",
          "action",
          "reason",
          "choice"
        ],
        "properties": {
          "path": {
            "type": "string",
            "maxLength": 2048
          },
          "baseline": {
            "type": "string",
            "maxLength": 2048
          },
          "before": {
            "type": "string",
            "maxLength": 2048
          },
          "upstream": {
            "type": "string",
            "maxLength": 2048
          },
          "action": {
            "type": "string",
            "enum": [
              "add",
              "update",
              "delete",
              "keep",
              "conflict"
            ],
            "maxLength": 2048
          },
          "reason": {
            "type": "string",
            "maxLength": 2048
          },
          "choice": {
            "type": "string",
            "maxLength": 2048
          }
        },
        "additionalProperties": false
      },
      "ModpackBaseline": {
        "type": "object",
        "required": [
          "source",
          "revision",
          "files",
          "selections",
          "content"
        ],
        "properties": {
          "source": {
            "$ref": "#/components/schemas/ModpackSource"
          },
          "revision": {
            "type": "string",
            "maxLength": 2048
          },
          "files": {
            "type": "object",
            "additionalProperties": {
              "type": "string",
              "maxLength": 2048
            },
            "maxProperties": 8192
          },
          "content": {
            "type": "object",
            "additionalProperties": {
              "type": "string",
              "maxLength": 2048
            },
            "maxProperties": 8192
          },
          "selections": {
            "type": "object",
            "additionalProperties": {
              "$ref": "#/components/schemas/ModpackSelection"
            },
            "maxProperties": 8192
          }
        },
        "additionalProperties": false
      },
      "ModpackSnapshot": {
        "type": "object",
        "required": [
          "blockers",
          "customizations"
        ],
        "properties": {
          "baseline": {
            "$ref": "#/components/schemas/ModpackBaseline"
          },
          "blockers": {
            "type": "array",
            "items": {
              "type": "string",
              "maxLength": 2048
            },
            "maxItems": 8192
          },
          "customizations": {
            "$ref": "#/components/schemas/ModpackCustomizationSummary"
          }
        },
        "additionalProperties": false
      },
      "ModpackPreview": {
        "type": "object",
        "required": [
          "id",
          "instance_id",
          "tuple",
          "revision",
          "baseline_revision",
          "source",
          "changes",
          "selections",
          "manual",
          "blockers",
          "excluded",
          "summary"
        ],
        "properties": {
          "id": {
            "type": "string",
            "maxLength": 2048
          },
          "instance_id": {
            "type": "string",
            "maxLength": 2048
          },
          "tuple": {
            "$ref": "#/components/schemas/ContentTuple"
          },
          "revision": {
            "type": "string",
            "maxLength": 2048
          },
          "baseline_revision": {
            "type": "string",
            "maxLength": 2048
          },
          "source": {
            "$ref": "#/components/schemas/ModpackSource"
          },
          "changes": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/ModpackChange"
            },
            "maxItems": 8192
          },
          "selections": {
            "type": "object",
            "additionalProperties": {
              "$ref": "#/components/schemas/ModpackSelection"
            },
            "maxProperties": 8192
          },
          "manual": {
            "type": "array",
            "items": {
              "type": "object",
              "required": [
                "path",
                "official_url",
                "hashes",
                "reason"
              ],
              "properties": {
                "path": {
                  "type": "string",
                  "maxLength": 2048
                },
                "official_url": {
                  "type": "string",
                  "maxLength": 2048
                },
                "hashes": {
                  "type": "object",
                  "additionalProperties": {
                    "type": "string",
                    "maxLength": 2048
                  },
                  "maxProperties": 8192
                },
                "reason": {
                  "type": "string",
                  "maxLength": 2048
                }
              },
              "additionalProperties": false
            },
            "maxItems": 8192
          },
          "blockers": {
            "type": "array",
            "items": {
              "type": "string",
              "maxLength": 2048
            },
            "maxItems": 8192
          },
          "excluded": {
            "type": "array",
            "items": {
              "type": "string",
              "maxLength": 2048
            },
            "maxItems": 8192
          },
          "summary": {
            "type": "string",
            "maxLength": 2048
          },
          "archive_manual": {
            "$ref": "#/components/schemas/ModpackArchiveManual"
          }
        },
        "additionalProperties": false
      },
      "ModpackArchiveManual": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "selection",
          "filename",
          "size",
          "hashes",
          "official_url",
          "reason"
        ],
        "properties": {
          "selection": {
            "$ref": "#/components/schemas/ContentSelection"
          },
          "filename": {
            "type": "string",
            "maxLength": 160
          },
          "size": {
            "type": "integer",
            "format": "int64",
            "minimum": 1,
            "maximum": 2147483648
          },
          "hashes": {
            "type": "object",
            "maxProperties": 8,
            "additionalProperties": {
              "type": "string",
              "maxLength": 128
            }
          },
          "official_url": {
            "type": "string",
            "maxLength": 2048
          },
          "reason": {
            "type": "string",
            "maxLength": 2048
          }
        }
      },
      "ModpackArchiveReceipt": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "sha256",
          "size"
        ],
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^[0-9a-f]{32}$"
          },
          "sha256": {
            "type": "string",
            "pattern": "^[0-9a-f]{64}$"
          },
          "size": {
            "type": "integer",
            "format": "int64",
            "minimum": 1,
            "maximum": 2147483648
          }
        }
      },
      "ModpackCustomization": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "path",
          "reasons",
          "evidence"
        ],
        "properties": {
          "path": {
            "type": "string",
            "minLength": 1,
            "maxLength": 900
          },
          "reasons": {
            "type": "array",
            "minItems": 1,
            "maxItems": 8,
            "uniqueItems": true,
            "items": {
              "type": "string",
              "enum": [
                "edited",
                "deleted",
                "retained",
                "pinned",
                "excluded",
                "disabled",
                "optional_selected",
                "optional_deselected"
              ]
            }
          },
          "evidence": {
            "type": "string",
            "enum": [
              "saved_selection",
              "observed_file",
              "saved_selection_and_observed_file"
            ]
          },
          "upstream_sha256": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "local_sha256": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          }
        }
      },
      "ModpackCustomizationSummary": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "observed_at",
          "entries",
          "checked_files",
          "total_files",
          "hashed_bytes",
          "complete",
          "truncated",
          "notices"
        ],
        "properties": {
          "observed_at": {
            "type": "string",
            "format": "date-time"
          },
          "source": {
            "$ref": "#/components/schemas/ModpackSource"
          },
          "entries": {
            "type": "array",
            "maxItems": 64,
            "items": {
              "$ref": "#/components/schemas/ModpackCustomization"
            }
          },
          "checked_files": {
            "type": "integer",
            "minimum": 0,
            "maximum": 256
          },
          "total_files": {
            "type": "integer",
            "minimum": 0,
            "maximum": 8192
          },
          "hashed_bytes": {
            "type": "integer",
            "format": "int64",
            "minimum": 0,
            "maximum": 16777216
          },
          "complete": {
            "type": "boolean"
          },
          "truncated": {
            "type": "boolean"
          },
          "notices": {
            "type": "array",
            "maxItems": 8,
            "items": {
              "type": "string",
              "maxLength": 2048
            }
          }
        }
      }
    }
  }
}
