    "/api/v1/instances/{instanceId}/modpack/archives": {
      "post": {
        "operationId": "uploadModpackArchive",
        "summary": "Administrator: verify exact official pack/server-pack archive acquisition",
        "description": "Requires administrator role and admin PAT scope. Catalog resolves original and official server-pack mappings; an absent CurseForge key remains unavailable. Size and published hashes are authoritative; no arbitrary ZIP import or URL input. Receipt expires after24hours.",
        "tags": [
          "modpacks"
        ],
        "security": [
          {
            "sessionCookie": []
          },
          {
            "personalToken": []
          }
        ],
        "parameters": [
          {
            "$ref": "#/components/parameters/ModpackInstanceId"
          },
          {
            "name": "provider",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "maxLength": 128,
              "enum": [
                "modrinth",
                "curseforge"
              ]
            }
          },
          {
            "name": "project_id",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "maxLength": 128
            }
          },
          {
            "name": "version_id",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "maxLength": 128
            }
          },
          {
            "name": "file_id",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "maxLength": 128
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/octet-stream": {
              "schema": {
                "type": "string",
                "format": "binary",
                "maxLength": 2147483648
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Digest-verified private archive receipt",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ModpackArchiveReceipt"
                }
              }
            }
          },
          "400": {
            "description": "Structured operation error",
