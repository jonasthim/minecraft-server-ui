{
  "openapi": "3.1.0",
  "info": {
    "title": "Minecraft Server UI API",
    "version": "0.0.0-dev",
    "description": "Health, identity and jobs API contracts with shared domain DTOs. Cookie mutations require X-CSRF-Token from /auth/me. Future feature schemas define reviewed handoff shapes only; they do not expose unimplemented endpoints. World uploads and existing-server imports are excluded."
