name: Development candidate packages
on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate version stamp only; no release is published
        type: string
        required: true
        default: v0.0.1
permissions:
  contents: read
jobs:
  native:
    name: Build candidate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            goos: linux
            extension: ''
          - os: windows-2022
            goos: windows
            extension: .exe
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: '0'
      CANDIDATE_VERSION: ${{ inputs.version }}
      CANDIDATE_OS: ${{ matrix.goos }}
      BINARY_EXTENSION: ${{ matrix.extension }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          architecture: x64
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          architecture: x64
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Validate version and native host before building
        run: |
          python .github/scripts/candidate-receipts.py --version "$CANDIDATE_VERSION" --validate-only
          test "$RUNNER_ARCH" = X64
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(go env GOHOSTOS)" = "$CANDIDATE_OS"
          test "$(go env GOOS)" = "$CANDIDATE_OS"
          test "$(go env GOARCH)" = amd64
      - name: Build embedded UI and stamped native binaries
        run: |
          npm ci --prefix web
          npm run build --prefix web
          mkdir -p candidate-input
          go build -trimpath -ldflags "-s -w -X main.version=$CANDIDATE_VERSION" -o "candidate-input/minecraft-ui-$CANDIDATE_OS-amd64$BINARY_EXTENSION" ./cmd/minecraft-ui
          go build -trimpath -ldflags "-s -w -X main.version=$CANDIDATE_VERSION" -o "candidate-input/minecraft-ui-update-$CANDIDATE_OS-amd64$BINARY_EXTENSION" ./cmd/minecraft-ui-update
          go build -trimpath -ldflags "-s -w -X main.version=$CANDIDATE_VERSION" -o "candidate-input/minecraft-ui-bootstrap-$CANDIDATE_OS-amd64$BINARY_EXTENSION" ./cmd/minecraft-ui-bootstrap
      - name: Execute native version and schema probes and bind receipts
        run: |
          python .github/scripts/candidate-receipts.py --version "$CANDIDATE_VERSION" --target "$CANDIDATE_OS" --manager "candidate-input/minecraft-ui-$CANDIDATE_OS-amd64$BINARY_EXTENSION" --updater "candidate-input/minecraft-ui-update-$CANDIDATE_OS-amd64$BINARY_EXTENSION" --bootstrap "candidate-input/minecraft-ui-bootstrap-$CANDIDATE_OS-amd64$BINARY_EXTENSION"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-input-${{ matrix.goos }}-${{ github.sha }}
          path: candidate-input/*
          if-no-files-found: error
          retention-days: 7
  package:
    name: Verify and retain development candidate
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CANDIDATE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          architecture: x64
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-input-*-${{ github.sha }}
          merge-multiple: true
          path: candidate-input
      - name: Verify producer and shipping verifier regression cases
        run: go test -count=1 -timeout=5m ./release/...
      - name: Produce signed development artifacts from native receipts
        shell: bash
        run: |
          candidate_schema=$(python3 -c 'import json; print(json.load(open("candidate-input/minecraft-ui-linux-amd64.version.json"))["schema"])')
          candidate_time=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          go run ./release/cmd/package --source . --out candidate-output --version "$CANDIDATE_VERSION" --repository jonasthim/minecraft-server-ui --schema "$candidate_schema" --published-at "$candidate_time" --linux-manager candidate-input/minecraft-ui-linux-amd64 --windows-manager candidate-input/minecraft-ui-windows-amd64.exe --linux-updater candidate-input/minecraft-ui-update-linux-amd64 --windows-updater candidate-input/minecraft-ui-update-windows-amd64.exe --development
          go run ./release/cmd/verify --artifacts candidate-output --trust-file candidate-output/development-trust.json --repository jonasthim/minecraft-server-ui --version "$CANDIDATE_VERSION" --schema "$candidate_schema"
          go run ./release/cmd/outer --repository jonasthim/minecraft-server-ui --version "$CANDIDATE_VERSION" --linux-preparer candidate-input/minecraft-ui-bootstrap-linux-amd64 --windows-preparer candidate-input/minecraft-ui-bootstrap-windows-amd64.exe --trust-file "$GITHUB_WORKSPACE/candidate-output/development-trust.json" --out "$GITHUB_WORKSPACE/outer-output" --development
          git rev-parse HEAD > candidate-output/source-commit.txt
          printf 'Native binary version probes and package verification only; not installed/game/release qualification.\n' > candidate-output/evidence-scope.txt
      - name: Retain development artifacts with public fixture trust only
        uses: actions/upload-artifact@v4
        with:
          name: development-candidate-${{ inputs.version }}-${{ github.sha }}
          path: candidate-output/*
          if-no-files-found: error
          retention-days: 14
      - name: Retain development preparers and entry scripts
        uses: actions/upload-artifact@v4
        with:
          name: development-bootstrap-${{ inputs.version }}-${{ github.sha }}
          path: outer-output/*
          if-no-files-found: error
          retention-days: 14
  prepare:
    name: Verify prepared inputs on ${{ matrix.os }}
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            goos: linux
            extension: ''
          - os: windows-2022
            goos: windows
            extension: .exe
    env:
      CANDIDATE_VERSION: ${{ inputs.version }}
      CANDIDATE_OS: ${{ matrix.goos }}
      BINARY_EXTENSION: ${{ matrix.extension }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          architecture: x64
          cache-dependency-path: go.sum
      - uses: actions/download-artifact@v4
        with:
          name: development-candidate-${{ inputs.version }}-${{ github.sha }}
          path: candidate-output
      - uses: actions/download-artifact@v4
        with:
          name: development-bootstrap-${{ inputs.version }}-${{ github.sha }}
          path: outer-output
      - name: Native preparer path and private-directory tests
        shell: bash
        run: |
          test "$RUNNER_ARCH" = X64
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(go env GOHOSTOS)" = "$CANDIDATE_OS"
          test "$(go env GOOS)" = "$CANDIDATE_OS"
          test "$(go env GOARCH)" = amd64
          go test -count=1 -timeout=5m ./release/bootstrap ./cmd/minecraft-ui-bootstrap
      - name: Execute the native preparer against authenticated development bundles
        shell: bash
        run: |
          python .github/scripts/candidate-bootstrap-check.py --version "$CANDIDATE_VERSION" --target "$CANDIDATE_OS" --binary "outer-output/minecraft-ui-bootstrap-$CANDIDATE_OS-amd64$BINARY_EXTENSION" --entry-directory outer-output --artifacts candidate-output --report bootstrap-result.json
      - name: Exercise PowerShell 7 entry-script guards without executing payloads
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./release/outer/windows_behavior_test.ps1 -EntryScript (Join-Path $env:GITHUB_WORKSPACE 'outer-output\minecraft-ui-prepare.ps1') -PayloadPath (Join-Path $env:GITHUB_WORKSPACE 'outer-output\minecraft-ui-bootstrap-windows-amd64.exe') -Development
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise Windows PowerShell 5.1 entry-script guards without executing payloads
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $testPath = Join-Path $env:GITHUB_WORKSPACE 'release\outer\windows_behavior_test.ps1'
          $testSource = [System.IO.File]::ReadAllText($testPath)
          $sourceRead = '$source = [System.IO.File]::ReadAllText($EntryScript)'
          $sourceReadReplacement = @'
          $source = [System.IO.File]::ReadAllText($EntryScript)
          $initNeedle = '$ErrorActionPreference = ''Stop'''
          if (($source.Split(@($initNeedle),[System.StringSplitOptions]::None)).Count -ne 2) { throw 'PowerShell 5.1 source init diagnostic seam drift' }
          $source = $source.Replace($initNeedle,$initNeedle+[Environment]::NewLine+'$script:OUTER_DIAGNOSTIC_STAGE = ''entry_start'''+[Environment]::NewLine+'$script:OUTER_DIAGNOSTIC_BOUND = $false')
          $createNeedle = 'function New-PrivateScratchFile([string]$Name) {'
          if (($source.Split(@($createNeedle),[System.StringSplitOptions]::None)).Count -ne 2) { throw 'PowerShell 5.1 scratch create diagnostic seam drift' }
          $source = $source.Replace($createNeedle,$createNeedle+[Environment]::NewLine+'    $script:OUTER_DIAGNOSTIC_STAGE = ''new_private_scratch_file''')
          $initializeNeedle = '        Initialize-PrivateIO'
          if (($source.Split(@($initializeNeedle),[System.StringSplitOptions]::None)).Count -ne 2) { throw 'PowerShell 5.1 private IO diagnostic seam drift' }
          $source = $source.Replace($initializeNeedle,'        $script:OUTER_DIAGNOSTIC_STAGE = ''initialize_private_io'''+[Environment]::NewLine+$initializeNeedle)
          $directoryDiagnosticTypeNeedle = '    public static class PrivateIO {'
          if (($source.Split(@($directoryDiagnosticTypeNeedle),[System.StringSplitOptions]::None)).Count -ne 2) { throw 'PowerShell 5.1 directory diagnostic type seam drift' }
          $directoryDiagnosticTypes = @(
              '    public sealed class DirectoryCleanupFailure : IOException {'
              '        public readonly int Stage; public readonly int Api; public readonly int Code;'
              '        public DirectoryCleanupFailure(int stage,int api,int code) : base("private scratch operation refused") { Stage=stage; Api=api; Code=code; }'
              '    }'
              '    sealed class NativeOperationFailure : IOException {'
              '        public readonly int Api; public readonly int Code;'
              '        public NativeOperationFailure(int api,int code) : base("private scratch operation refused") { Api=api; Code=code; }'
              '    }'
              '    public static class PrivateIO {'
          ) -join [Environment]::NewLine
          $source = $source.Replace($directoryDiagnosticTypeNeedle,$directoryDiagnosticTypes)
          $deleteOwnedNeedle = @(
              '        public static void DeleteOwned(string path, string identity, string sddl, bool directory) {'
              '            // A renamed/replaced path is never deleted. Security and identity'
              '            // are checked on the exact DELETE handle used for disposition.'
              '            using (SafeFileHandle handle=Open(path,Delete|ReadControl|ReadAttributes,7,3,directory,null)) {'
              '                AssertBound(handle,identity,sddl,directory);'
              '                Disposition disposition=new Disposition(); disposition.DeleteFile=true;'
              '                if (!SetFileInformationByHandle(handle,4,ref disposition,1)) throw Failure();'
              '            }'
              '        }'
          ) -join [Environment]::NewLine
          $deleteOwnedReplacement = @(
              '        public static void DeleteOwned(string path, string identity, string sddl, bool directory) {'
              '            SafeFileHandle handle;'
              '            try { handle=Open(path,Delete|ReadControl|ReadAttributes,7,3,directory,null); }'
              '            catch (NativeOperationFailure failure) { throw new DirectoryCleanupFailure(1,failure.Api,failure.Code); }'
              '            catch { throw new DirectoryCleanupFailure(1,6,-1); }'
              '            using (handle) {'
              '                try { AssertBound(handle,identity,sddl,directory); }'
              '                catch (NativeOperationFailure failure) { throw new DirectoryCleanupFailure(2,failure.Api,failure.Code); }'
              '                catch { throw new DirectoryCleanupFailure(2,6,-1); }'
              '                Disposition disposition=new Disposition(); disposition.DeleteFile=true;'
              '                if (!SetFileInformationByHandle(handle,4,ref disposition,1)) { int code=Marshal.GetLastWin32Error(); throw new DirectoryCleanupFailure(3,4,code); }'
              '            }'
              '        }'
          ) -join [Environment]::NewLine
          $directoryDiagnosticSeams = @(
              @{ needle = '                if (handle.IsInvalid) { handle.Dispose(); throw Failure(); }'; replacement = '                if (handle.IsInvalid) { int code=Marshal.GetLastWin32Error(); handle.Dispose(); throw new NativeOperationFailure(1,code); }' },
              @{ needle = '            if (!GetFileInformationByHandle(handle,out info) || (info.Attributes & Reparse) != 0 || ((info.Attributes & Directory) != 0) != directory || (!directory && info.Links != 1)) throw Failure();'; replacement = @('            if (!GetFileInformationByHandle(handle,out info)) throw new NativeOperationFailure(2,Marshal.GetLastWin32Error());','            if ((info.Attributes & Reparse) != 0 || ((info.Attributes & Directory) != 0) != directory || (!directory && info.Links != 1)) throw new NativeOperationFailure(5,-1);') -join [Environment]::NewLine },
              @{ needle = '            if (result != 0) throw Failure();'; replacement = '            if (result != 0) throw new NativeOperationFailure(3,(int)result);' },
              @{ needle = '                if (actual.Owner == null || !actual.Owner.Equals(expected.Owner) || (actual.ControlFlags & ControlFlags.DiscretionaryAclProtected)==0) throw Failure();'; replacement = '                if (actual.Owner == null || !actual.Owner.Equals(expected.Owner) || (actual.ControlFlags & ControlFlags.DiscretionaryAclProtected)==0) throw new NativeOperationFailure(5,-1);' },
              @{ needle = '                if (a.Length != e.Length) throw Failure();'; replacement = '                if (a.Length != e.Length) throw new NativeOperationFailure(5,-1);' },
              @{ needle = '                for (int i=0;i<a.Length;i++) if (!String.Equals(a[i],e[i],StringComparison.Ordinal)) throw Failure();'; replacement = '                for (int i=0;i<a.Length;i++) if (!String.Equals(a[i],e[i],StringComparison.Ordinal)) throw new NativeOperationFailure(5,-1);' },
              @{ needle = $deleteOwnedNeedle; replacement = $deleteOwnedReplacement }
          )
          foreach ($seam in $directoryDiagnosticSeams) {
              if (($source.Split(@($seam.needle),[System.StringSplitOptions]::None)).Count -ne 2) { throw 'PowerShell 5.1 directory diagnostic API seam drift' }
              $source = $source.Replace($seam.needle,$seam.replacement)
          }
          $childDeleteReplacement = @(
              '                if ($ownedFiles.ContainsKey($name)) {'
              '                    if ($name -ceq ''trust.json'') { $script:OUTER_DIAGNOSTIC_STAGE = ''delete_child_trust'' }'
              '                    elseif ($name -ceq ''minecraft-ui-bootstrap.exe'') { $script:OUTER_DIAGNOSTIC_STAGE = ''delete_child_binary'' }'
              '                    elseif ($name -ceq ''result.json'') { $script:OUTER_DIAGNOSTIC_STAGE = ''delete_child_result'' }'
              '                    elseif ($name -ceq ''error.txt'') { $script:OUTER_DIAGNOSTIC_STAGE = ''delete_child_error'' }'
              '                    else { $script:OUTER_DIAGNOSTIC_STAGE = ''delete_child_unknown'' }'
              '                    [MinecraftUiOuter.PrivateIO]::DeleteOwned([System.IO.Path]::Combine($scratch,$name),$ownedFiles[$name],$fileSDDL,$false)'
              '                }'
          ) -join [Environment]::NewLine
          $cleanupSeams = @(
              @{ needle = '    foreach ($retained in @($binaryWriter,$trustFile,$file,$resultFile,$errorFile)) {'; replacement = '    $script:OUTER_DIAGNOSTIC_STAGE = ''close_handles'''+[Environment]::NewLine+'    foreach ($retained in @($binaryWriter,$trustFile,$file,$resultFile,$errorFile)) {' },
              @{ needle = '            Assert-Scratch $scratch $scratchIdentity'; replacement = '            $script:OUTER_DIAGNOSTIC_STAGE = ''verify_scratch'''+[Environment]::NewLine+'            Assert-Scratch $scratch $scratchIdentity' },
              @{ needle = '            [MinecraftUiOuter.PrivateIO]::AssertBound($scratchHandle,$scratchID,$directorySDDL,$true)'; replacement = '            [MinecraftUiOuter.PrivateIO]::AssertBound($scratchHandle,$scratchID,$directorySDDL,$true)'+[Environment]::NewLine+'            $script:OUTER_DIAGNOSTIC_BOUND = $true' },
              @{ needle = '                if ($ownedFiles.ContainsKey($name)) { [MinecraftUiOuter.PrivateIO]::DeleteOwned([System.IO.Path]::Combine($scratch,$name),$ownedFiles[$name],$fileSDDL,$false) }'; replacement = $childDeleteReplacement },
              @{ needle = '            $scratchHandle.Dispose(); $scratchHandle = $null'; replacement = '            $script:OUTER_DIAGNOSTIC_STAGE = ''close_handles'''+[Environment]::NewLine+'            $scratchHandle.Dispose(); $scratchHandle = $null' },
              @{ needle = '            [MinecraftUiOuter.PrivateIO]::DeleteOwned($scratch,$scratchID,$directorySDDL,$true)'; replacement = '            $script:OUTER_DIAGNOSTIC_STAGE = ''delete_directory'''+[Environment]::NewLine+'            [MinecraftUiOuter.PrivateIO]::DeleteOwned($scratch,$scratchID,$directorySDDL,$true)' }
          )
          foreach ($seam in $cleanupSeams) {
              if (($source.Split(@($seam.needle),[System.StringSplitOptions]::None)).Count -ne 2) { throw 'PowerShell 5.1 cleanup diagnostic seam drift' }
              $source = $source.Replace($seam.needle,$seam.replacement)
          }
          $cleanupCatchNeedle = "        } catch { `$cleanupRefused = `$true; [Console]::Error.WriteLine('private bootstrap scratch cleanup refused') }"
          if (($source.Split(@($cleanupCatchNeedle),[System.StringSplitOptions]::None)).Count -ne 2) { throw 'PowerShell 5.1 cleanup catch diagnostic seam drift' }
          $cleanupCatchReplacement = @(
              '        } catch {'
              '            $cleanupRefused = $true'
              '            $cleanupException = $_.Exception'
              '            $cleanupType = switch ($cleanupException.GetType().FullName) {'
              '                ''System.Management.Automation.RuntimeException'' { ''runtime'' }'
              '                ''System.Management.Automation.MethodInvocationException'' { ''method_invocation'' }'
              '                ''System.IO.IOException'' { ''io'' }'
              '                ''System.UnauthorizedAccessException'' { ''unauthorized'' }'
              '                ''System.InvalidOperationException'' { ''invalid_operation'' }'
              '                ''System.Security.SecurityException'' { ''security'' }'
              '                ''System.ComponentModel.Win32Exception'' { ''win32'' }'
              '                ''System.Exception'' { ''exception'' }'
              '                default { ''other'' }'
              '            }'
              '            $cleanupInnerType = ''none''; $cleanupInnerWin32 = -1; $cleanupNativeStage = ''none''; $cleanupNativeApi = ''none''; $cleanupNativeCode = -1'
              '            $innerException = $cleanupException.InnerException'
              '            for ($depth = 0; $depth -lt 3 -and $null -ne $innerException; $depth++) {'
              '                if ($cleanupInnerType -eq ''none'') {'
              '                    $cleanupInnerType = switch ($innerException.GetType().FullName) {'
              '                        ''System.Management.Automation.RuntimeException'' { ''runtime'' }'
              '                        ''System.Management.Automation.MethodInvocationException'' { ''method_invocation'' }'
              '                        ''System.IO.IOException'' { ''io'' }'
              '                        ''System.UnauthorizedAccessException'' { ''unauthorized'' }'
              '                        ''System.InvalidOperationException'' { ''invalid_operation'' }'
              '                        ''System.Security.SecurityException'' { ''security'' }'
              '                        ''System.ComponentModel.Win32Exception'' { ''win32'' }'
              '                        ''System.Exception'' { ''exception'' }'
              '                        default { ''other'' }'
              '                    }'
              '                }'
              '                if ($innerException -is [System.ComponentModel.Win32Exception] -and $cleanupInnerWin32 -eq -1) { try { $candidateCode = [int]$innerException.NativeErrorCode; if ($candidateCode -ge 0 -and $candidateCode -le 65535) { $cleanupInnerWin32 = $candidateCode } } catch {} }'
              '                if ($script:OUTER_DIAGNOSTIC_STAGE -eq ''delete_directory'' -and $innerException.GetType().FullName -ceq ''MinecraftUiOuter.DirectoryCleanupFailure'') { try { $stageCode = [int]$innerException.Stage; $apiCode = [int]$innerException.Api; $nativeCode = [int]$innerException.Code; if ($stageCode -ge 1 -and $stageCode -le 3 -and $apiCode -ge 1 -and $apiCode -le 6 -and (($nativeCode -eq -1) -or ($nativeCode -ge 0 -and $nativeCode -le 65535))) { $cleanupNativeStage = @(''dir_open'',''dir_validate'',''dir_disposition'')[$stageCode-1]; $cleanupNativeApi = @(''create_file'',''get_file_information'',''get_security_info'',''set_file_information'',''validation'',''managed_failure'')[$apiCode-1]; $cleanupNativeCode = $nativeCode } } catch {} }'
              '                try { $innerException = $innerException.InnerException } catch { $innerException = $null }'
              '            }'
              '            $cleanupLine = 0'
              '            try { $candidateLine = [int]$_.InvocationInfo.ScriptLineNumber; if ($candidateLine -ge 1 -and $candidateLine -le 5000) { $cleanupLine = $candidateLine } } catch {}'
              '            $cleanupHResult = ''00000000'''
              '            try { $cleanupHResult = ''{0:X8}'' -f ([long]$cleanupException.HResult -band 4294967295) } catch {}'
              '            $cleanupWin32 = -1'
              '            if ($cleanupException -is [System.ComponentModel.Win32Exception]) { try { $candidateCode = [int]$cleanupException.NativeErrorCode; if ($candidateCode -ge 0 -and $candidateCode -le 65535) { $cleanupWin32 = $candidateCode } } catch {} }'
              '            $cleanupDiagnostic = [ordered]@{ stage=$script:OUTER_DIAGNOSTIC_STAGE; type=$cleanupType; inner_type=$cleanupInnerType; line=$cleanupLine; hresult=$cleanupHResult; win32=$cleanupWin32; inner_win32=$cleanupInnerWin32; native_stage=$cleanupNativeStage; native_api=$cleanupNativeApi; native_code=$cleanupNativeCode; bound=$script:OUTER_DIAGNOSTIC_BOUND }'
              '            try { [System.IO.File]::WriteAllText($env:OUTER_TEST_CLEANUP_DIAGNOSTICS,(ConvertTo-Json -InputObject $cleanupDiagnostic -Compress)) } catch {}'
              '            [Console]::Error.WriteLine(''private bootstrap scratch cleanup refused'')'
              '        }'
          ) -join [Environment]::NewLine
          $source = $source.Replace($cleanupCatchNeedle,$cleanupCatchReplacement)
          $handleCatchNeedle = "catch { `$cleanupRefused = `$true; [Console]::Error.WriteLine('private bootstrap handle cleanup refused') }"
          if (($source.Split(@($handleCatchNeedle),[System.StringSplitOptions]::None)).Count -ne 3) { throw 'PowerShell 5.1 handle cleanup diagnostic seam drift' }
          $handleCatchReplacement = @(
              'catch {'
              '    $cleanupRefused = $true'
              '    $script:OUTER_DIAGNOSTIC_STAGE = ''close_handles'''
              '    $cleanupException = $_.Exception'
              '    $cleanupType = switch ($cleanupException.GetType().FullName) {'
              '        ''System.Management.Automation.RuntimeException'' { ''runtime'' }'
              '        ''System.Management.Automation.MethodInvocationException'' { ''method_invocation'' }'
              '        ''System.IO.IOException'' { ''io'' }'
              '        ''System.UnauthorizedAccessException'' { ''unauthorized'' }'
              '        ''System.InvalidOperationException'' { ''invalid_operation'' }'
              '        ''System.Security.SecurityException'' { ''security'' }'
              '        ''System.ComponentModel.Win32Exception'' { ''win32'' }'
              '        ''System.Exception'' { ''exception'' }'
              '        default { ''other'' }'
              '    }'
              '    $cleanupInnerType = ''none''; $cleanupInnerWin32 = -1; $cleanupNativeStage = ''none''; $cleanupNativeApi = ''none''; $cleanupNativeCode = -1'
              '    $innerException = $cleanupException.InnerException'
              '    for ($depth = 0; $depth -lt 3 -and $null -ne $innerException; $depth++) {'
              '        if ($cleanupInnerType -eq ''none'') {'
              '            $cleanupInnerType = switch ($innerException.GetType().FullName) {'
              '                ''System.Management.Automation.RuntimeException'' { ''runtime'' }'
              '                ''System.Management.Automation.MethodInvocationException'' { ''method_invocation'' }'
              '                ''System.IO.IOException'' { ''io'' }'
              '                ''System.UnauthorizedAccessException'' { ''unauthorized'' }'
              '                ''System.InvalidOperationException'' { ''invalid_operation'' }'
              '                ''System.Security.SecurityException'' { ''security'' }'
              '                ''System.ComponentModel.Win32Exception'' { ''win32'' }'
              '                ''System.Exception'' { ''exception'' }'
              '                default { ''other'' }'
              '            }'
              '        }'
              '        if ($innerException -is [System.ComponentModel.Win32Exception] -and $cleanupInnerWin32 -eq -1) { try { $candidateCode = [int]$innerException.NativeErrorCode; if ($candidateCode -ge 0 -and $candidateCode -le 65535) { $cleanupInnerWin32 = $candidateCode } } catch {} }'
              '        if ($script:OUTER_DIAGNOSTIC_STAGE -eq ''delete_directory'' -and $innerException.GetType().FullName -ceq ''MinecraftUiOuter.DirectoryCleanupFailure'') { try { $stageCode = [int]$innerException.Stage; $apiCode = [int]$innerException.Api; $nativeCode = [int]$innerException.Code; if ($stageCode -ge 1 -and $stageCode -le 3 -and $apiCode -ge 1 -and $apiCode -le 6 -and (($nativeCode -eq -1) -or ($nativeCode -ge 0 -and $nativeCode -le 65535))) { $cleanupNativeStage = @(''dir_open'',''dir_validate'',''dir_disposition'')[$stageCode-1]; $cleanupNativeApi = @(''create_file'',''get_file_information'',''get_security_info'',''set_file_information'',''validation'',''managed_failure'')[$apiCode-1]; $cleanupNativeCode = $nativeCode } } catch {} }'
              '        try { $innerException = $innerException.InnerException } catch { $innerException = $null }'
              '    }'
              '    $cleanupLine = 0'
              '    try { $candidateLine = [int]$_.InvocationInfo.ScriptLineNumber; if ($candidateLine -ge 1 -and $candidateLine -le 5000) { $cleanupLine = $candidateLine } } catch {}'
