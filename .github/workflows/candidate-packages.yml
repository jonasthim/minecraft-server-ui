name: Development candidate packages
on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate version stamp only; no release is published
        type: string
        required: true
        default: v0.0.1
permissions:
  contents: read
jobs:
  native:
    name: Build candidate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            goos: linux
            extension: ''
          - os: windows-2022
            goos: windows
            extension: .exe
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: '0'
      CANDIDATE_VERSION: ${{ inputs.version }}
      CANDIDATE_OS: ${{ matrix.goos }}
      BINARY_EXTENSION: ${{ matrix.extension }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          architecture: x64
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          architecture: x64
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Validate version and native host before building
        run: |
          python .github/scripts/candidate-receipts.py --version "$CANDIDATE_VERSION" --validate-only
          test "$RUNNER_ARCH" = X64
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(go env GOHOSTOS)" = "$CANDIDATE_OS"
          test "$(go env GOOS)" = "$CANDIDATE_OS"
          test "$(go env GOARCH)" = amd64
      - name: Build embedded UI and stamped native binaries
        run: |
          npm ci --prefix web
          npm run build --prefix web
          mkdir -p candidate-input
          go build -trimpath -ldflags "-s -w -X main.version=$CANDIDATE_VERSION" -o "candidate-input/minecraft-ui-$CANDIDATE_OS-amd64$BINARY_EXTENSION" ./cmd/minecraft-ui
          go build -trimpath -ldflags "-s -w -X main.version=$CANDIDATE_VERSION" -o "candidate-input/minecraft-ui-update-$CANDIDATE_OS-amd64$BINARY_EXTENSION" ./cmd/minecraft-ui-update
          go build -trimpath -ldflags "-s -w -X main.version=$CANDIDATE_VERSION" -o "candidate-input/minecraft-ui-bootstrap-$CANDIDATE_OS-amd64$BINARY_EXTENSION" ./cmd/minecraft-ui-bootstrap
      - name: Execute native version and schema probes and bind receipts
        run: |
          python .github/scripts/candidate-receipts.py --version "$CANDIDATE_VERSION" --target "$CANDIDATE_OS" --manager "candidate-input/minecraft-ui-$CANDIDATE_OS-amd64$BINARY_EXTENSION" --updater "candidate-input/minecraft-ui-update-$CANDIDATE_OS-amd64$BINARY_EXTENSION" --bootstrap "candidate-input/minecraft-ui-bootstrap-$CANDIDATE_OS-amd64$BINARY_EXTENSION"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-input-${{ matrix.goos }}-${{ github.sha }}
          path: candidate-input/*
          if-no-files-found: error
          retention-days: 7
  package:
    name: Verify and retain development candidate
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CANDIDATE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          architecture: x64
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-input-*-${{ github.sha }}
          merge-multiple: true
          path: candidate-input
      - name: Verify producer and shipping verifier regression cases
        run: go test -count=1 -timeout=5m ./release/...
      - name: Produce signed development artifacts from native receipts
        shell: bash
        run: |
          candidate_schema=$(python3 -c 'import json; print(json.load(open("candidate-input/minecraft-ui-linux-amd64.version.json"))["schema"])')
          candidate_time=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          go run ./release/cmd/package --source . --out candidate-output --version "$CANDIDATE_VERSION" --repository jonasthim/minecraft-server-ui --schema "$candidate_schema" --published-at "$candidate_time" --linux-manager candidate-input/minecraft-ui-linux-amd64 --windows-manager candidate-input/minecraft-ui-windows-amd64.exe --linux-updater candidate-input/minecraft-ui-update-linux-amd64 --windows-updater candidate-input/minecraft-ui-update-windows-amd64.exe --development
          go run ./release/cmd/verify --artifacts candidate-output --trust-file candidate-output/development-trust.json --repository jonasthim/minecraft-server-ui --version "$CANDIDATE_VERSION" --schema "$candidate_schema"
          go run ./release/cmd/outer --repository jonasthim/minecraft-server-ui --version "$CANDIDATE_VERSION" --linux-preparer candidate-input/minecraft-ui-bootstrap-linux-amd64 --windows-preparer candidate-input/minecraft-ui-bootstrap-windows-amd64.exe --trust-file "$GITHUB_WORKSPACE/candidate-output/development-trust.json" --out "$GITHUB_WORKSPACE/outer-output" --development
          git rev-parse HEAD > candidate-output/source-commit.txt
          printf 'Native binary version probes and package verification only; not installed/game/release qualification.\n' > candidate-output/evidence-scope.txt
      - name: Retain development artifacts with public fixture trust only
        uses: actions/upload-artifact@v4
        with:
          name: development-candidate-${{ inputs.version }}-${{ github.sha }}
          path: candidate-output/*
          if-no-files-found: error
          retention-days: 14
      - name: Retain development preparers and entry scripts
        uses: actions/upload-artifact@v4
        with:
          name: development-bootstrap-${{ inputs.version }}-${{ github.sha }}
          path: outer-output/*
          if-no-files-found: error
          retention-days: 14
  prepare:
    name: Verify prepared inputs on ${{ matrix.os }}
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            goos: linux
            extension: ''
          - os: windows-2022
            goos: windows
            extension: .exe
    env:
      CANDIDATE_VERSION: ${{ inputs.version }}
      CANDIDATE_OS: ${{ matrix.goos }}
      BINARY_EXTENSION: ${{ matrix.extension }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          architecture: x64
          cache-dependency-path: go.sum
      - uses: actions/download-artifact@v4
        with:
          name: development-candidate-${{ inputs.version }}-${{ github.sha }}
          path: candidate-output
      - uses: actions/download-artifact@v4
        with:
          name: development-bootstrap-${{ inputs.version }}-${{ github.sha }}
          path: outer-output
      - name: Native preparer path and private-directory tests
        shell: bash
        run: |
          test "$RUNNER_ARCH" = X64
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(go env GOHOSTOS)" = "$CANDIDATE_OS"
          test "$(go env GOOS)" = "$CANDIDATE_OS"
          test "$(go env GOARCH)" = amd64
          go test -count=1 -timeout=5m ./release/bootstrap ./cmd/minecraft-ui-bootstrap
      - name: Execute the native preparer against authenticated development bundles
        shell: bash
        run: |
          python .github/scripts/candidate-bootstrap-check.py --version "$CANDIDATE_VERSION" --target "$CANDIDATE_OS" --binary "outer-output/minecraft-ui-bootstrap-$CANDIDATE_OS-amd64$BINARY_EXTENSION" --entry-directory outer-output --artifacts candidate-output --report bootstrap-result.json
      - name: Exercise PowerShell 7 entry-script guards without executing payloads
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./release/outer/windows_behavior_test.ps1 -EntryScript (Join-Path $env:GITHUB_WORKSPACE 'outer-output\minecraft-ui-prepare.ps1') -PayloadPath (Join-Path $env:GITHUB_WORKSPACE 'outer-output\minecraft-ui-bootstrap-windows-amd64.exe') -Development
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise Windows PowerShell 5.1 entry-script guards without executing payloads
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $testPath = Join-Path $env:GITHUB_WORKSPACE 'release\outer\windows_behavior_test.ps1'
          $testSource = [System.IO.File]::ReadAllText($testPath)
          $sourceRead = '$source = [System.IO.File]::ReadAllText($EntryScript)'
          $sourceReadReplacement = @'
          $source = [System.IO.File]::ReadAllText($EntryScript)
          $initNeedle = '$ErrorActionPreference = ''Stop'''
          if (($source.Split(@($initNeedle),[System.StringSplitOptions]::None)).Count -ne 2) { throw 'PowerShell 5.1 source init diagnostic seam drift' }
          $source = $source.Replace($initNeedle,$initNeedle+[Environment]::NewLine+'$script:OUTER_DIAGNOSTIC_STAGE = ''entry_start''')
          $createNeedle = 'function New-PrivateScratchFile([string]$Name) {'
          if (($source.Split(@($createNeedle),[System.StringSplitOptions]::None)).Count -ne 2) { throw 'PowerShell 5.1 scratch create diagnostic seam drift' }
          $source = $source.Replace($createNeedle,$createNeedle+[Environment]::NewLine+'    $script:OUTER_DIAGNOSTIC_STAGE = ''new_private_scratch_file''')
          $initializeNeedle = '        Initialize-PrivateIO'
          if (($source.Split(@($initializeNeedle),[System.StringSplitOptions]::None)).Count -ne 2) { throw 'PowerShell 5.1 private IO diagnostic seam drift' }
          $source = $source.Replace($initializeNeedle,'        $script:OUTER_DIAGNOSTIC_STAGE = ''initialize_private_io'''+[Environment]::NewLine+$initializeNeedle)
          $catchNeedle = '    [Console]::Error.WriteLine(''bootstrap preparation refused; check platform, arguments, trust and verified release availability'')'
          if (($source.Split(@($catchNeedle),[System.StringSplitOptions]::None)).Count -ne 2) { throw 'PowerShell 5.1 outer catch diagnostic seam drift' }
          $catchReplacement = @(
              '    $failureException = $_.Exception'
              '    $failureType = switch ($failureException.GetType().FullName) {'
              '        ''System.Management.Automation.RuntimeException'' { ''runtime'' }'
              '        ''System.Management.Automation.MethodInvocationException'' { ''method_invocation'' }'
              '        ''System.Management.Automation.CommandNotFoundException'' { ''command_not_found'' }'
              '        ''System.Management.Automation.ParameterBindingException'' { ''parameter_binding'' }'
              '        ''System.IO.IOException'' { ''io'' }'
              '        ''System.UnauthorizedAccessException'' { ''unauthorized'' }'
              '        ''System.InvalidOperationException'' { ''invalid_operation'' }'
              '        ''System.TypeInitializationException'' { ''type_initialization'' }'
              '        ''System.Security.SecurityException'' { ''security'' }'
              '        ''System.ComponentModel.Win32Exception'' { ''win32'' }'
              '        ''System.Exception'' { ''exception'' }'
              '        default { ''other'' }'
              '    }'
              '    $failureLine = 0'
              '    try { $candidateLine = [int]$_.InvocationInfo.ScriptLineNumber; if ($candidateLine -ge 1 -and $candidateLine -le 5000) { $failureLine = $candidateLine } } catch {}'
              '    $failureHResult = ''00000000'''
              '    try { $failureHResult = ''{0:X8}'' -f ([long]$failureException.HResult -band 4294967295) } catch {}'
              '    $failureWin32 = -1'
              '    if ($failureException -is [System.ComponentModel.Win32Exception]) { try { $candidateCode = [int]$failureException.NativeErrorCode; if ($candidateCode -ge 0 -and $candidateCode -le 65535) { $failureWin32 = $candidateCode } } catch {} }'
              '    $failureDiagnostic = [ordered]@{ type=$failureType; stage=$script:OUTER_DIAGNOSTIC_STAGE; line=$failureLine; hresult=$failureHResult; win32=$failureWin32 }'
              '    try { [System.IO.File]::WriteAllText($env:OUTER_TEST_DIAGNOSTICS,(ConvertTo-Json -InputObject $failureDiagnostic -Compress)) } catch {}'
              '    [Console]::Error.WriteLine(''bootstrap preparation refused; check platform, arguments, trust and verified release availability'')'
          ) -join [Environment]::NewLine
          $source = $source.Replace($catchNeedle,$catchReplacement)
          '@
          if (($testSource.Split(@($sourceRead),[System.StringSplitOptions]::None)).Count -ne 2) { throw 'PowerShell 5.1 source instrumentation seam drift' }
          $testSource = $testSource.Replace($sourceRead,$sourceReadReplacement)
          $aclPathLine = '        $env:OUTER_TEST_ACLS = [System.IO.Path]::Combine($root,($mode+''.acls''))'
          if (($testSource.Split(@($aclPathLine),[System.StringSplitOptions]::None)).Count -ne 2) { throw 'PowerShell 5.1 diagnostic path seam drift' }
          $testSource = $testSource.Replace($aclPathLine,$aclPathLine+[Environment]::NewLine+'        $env:OUTER_TEST_DIAGNOSTICS = [System.IO.Path]::Combine($root,($mode+''.diagnostics''))')
          $needle = "if ((`$exit -eq 0) -ne `$success) { throw ('unexpected result for '+`$mode) }"
          if (($testSource.Split(@($needle),[System.StringSplitOptions]::None)).Count -ne 2) { throw 'PowerShell 5.1 diagnostic seam drift' }
          $replacement = @'
          if (($exit -eq 0) -ne $success) {
              if ($mode -eq 'good') {
                  $stage = 'child_exit_unclassified'
                  $argvStatus = 'unavailable'
                  if (Test-Path -LiteralPath $env:OUTER_TEST_ARGS) {
                      $stage = 'native_runner_reached'
                      try {
                          $actualScratch = [System.IO.File]::ReadAllText($env:OUTER_TEST_SCRATCH)
                          $expectedArgv = @('prepare','--repository',$expectedRepository,'--trust-file',[System.IO.Path]::Combine($actualScratch,'trust.json'),'--version',$version,'--output',$output)
                          if (($call -contains '-AllowDevelopment')) { $expectedArgv += '--allow-development' }
                          Assert-NativeArgvJson ([System.IO.File]::ReadAllText($env:OUTER_TEST_ARGS)) $expectedArgv
                          $argvStatus = 'match'
                      } catch { $argvStatus = 'mismatch' }
                  }
                  $exitCode = -1
                  if ($exit -is [int] -and $exit -ge 0 -and $exit -le 255) { $exitCode = $exit }
                  $failureType = 'unavailable'; $failureLine = 0; $failureHResult = '00000000'; $failureWin32 = -1
                  if (Test-Path -LiteralPath $env:OUTER_TEST_DIAGNOSTICS) {
                      try {
                          $failure = ConvertFrom-Json -InputObject ([System.IO.File]::ReadAllText($env:OUTER_TEST_DIAGNOSTICS))
                          if ($failure.type -cin @('runtime','method_invocation','command_not_found','parameter_binding','io','unauthorized','invalid_operation','type_initialization','security','win32','exception','other')) { $failureType = $failure.type }
                          if ($failure.stage -cin @('entry_start','initialize_private_io','new_private_scratch_file')) { $stage = $failure.stage }
                          if ($failure.line -is [int] -and $failure.line -ge 0 -and $failure.line -le 5000) { $failureLine = $failure.line }
                          if ([string]$failure.hresult -cmatch '^[0-9A-F]{8}$') { $failureHResult = $failure.hresult }
                          if ($failure.win32 -is [int] -and $failure.win32 -ge -1 -and $failure.win32 -le 65535) { $failureWin32 = $failure.win32 }
                      } catch { $failureType = 'unavailable' }
                  }
                  [Console]::Error.WriteLine(('PowerShell 5.1 good-child diagnostic: exit='+$exitCode+' stage='+$stage+' argv='+$argvStatus+' type='+$failureType+' line='+$failureLine+' hresult='+$failureHResult+' win32='+$failureWin32))
              }
              throw ('unexpected result for '+$mode)
          }
          '@
          $diagnosticTestPath = Join-Path $env:RUNNER_TEMP 'windows_behavior_test_diagnostic.ps1'
          $patchedSource = $testSource.Replace($needle,$replacement)
          [System.IO.File]::WriteAllText($diagnosticTestPath,$patchedSource,[System.Text.UTF8Encoding]::new($false))
          & $diagnosticTestPath -EntryScript (Join-Path $env:GITHUB_WORKSPACE 'outer-output\minecraft-ui-prepare.ps1') -PayloadPath (Join-Path $env:GITHUB_WORKSPACE 'outer-output\minecraft-ui-bootstrap-windows-amd64.exe') -Development
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain bounded bootstrap qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-native-${{ matrix.goos }}-${{ inputs.version }}-${{ github.sha }}
          path: bootstrap-result.json
          if-no-files-found: warn
          retention-days: 14
# No tag trigger, production private key, write permission or publication step.
